name: Build and release TouchMusic
on:
  push:
    branches: [main]
    paths:
      - pyproject.toml
      - .github/workflows/release.yml
      - .github/workflows/tests.yml
      - touchmusic/**
      - tools/**
      - MANIFEST.in
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: Publish to PyPI after configuring its trusted publisher
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: touchmusic-release
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/tests.yml
  native:
    uses: ./.github/workflows/native-bridge.yml
  build:
    needs: [test, native]
    runs-on: ubuntu-latest
    outputs:
      publishable: ${{ steps.version.outputs.publishable }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Identify stable release eligibility
        id: version
        run: python tools/release_version.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build Python distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Check package entry point
        run: |
          python -m pip install --no-deps dist/*.whl
          cd /tmp
          touchmusic --version
          touchmusic --help
      - uses: actions/download-artifact@v4
        with:
          name: touchmusic-native-windows
          path: dist/
      - name: Build Windows setup ZIP and checksums
        run: python tools/build_release.py
      - name: Reuse exact published distributions on rerun
        if: steps.version.outputs.publishable == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if gh release view "v$version" >/dev/null 2>&1; then
            gh release download "v$version" --pattern "*.whl" --pattern "*.tar.gz" --dir dist --clobber
            python -m twine check dist/*.whl dist/*.tar.gz
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: |
            dist/*.whl
            dist/*.tar.gz
      - name: Preserve reviewable development packages
        if: steps.version.outputs.publishable != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: touchmusic-development-packages
          path: dist/*
      - name: Publish GitHub release
        if: steps.version.outputs.publishable == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists."
          else
            gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "TouchMusic $version" --notes-file release-notes.md
          fi
  publish-pypi:
    needs: build
    if: needs.build.outputs.publishable == 'true' && (github.event_name == 'push' || vars.PYPI_PUBLISH == 'true' || inputs.publish_pypi == true)
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist/
      - name: Publish wheel and source distribution
        uses: pypa/gh-action-pypi-publish@release/v1
