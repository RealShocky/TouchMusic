name: Build and release TouchMusic
on:
  push:
    branches: [main]
    paths:
      - pyproject.toml
      - .github/workflows/release.yml
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: Publish to PyPI after configuring its trusted publisher
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: touchmusic-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build Python distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Check package entry point
        run: |
          python -m pip install --no-deps dist/*.whl
          cd /tmp
          touchmusic --version
          touchmusic --help
      - name: Build Windows setup ZIP and checksums
        run: python tools/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: |
            dist/*.whl
            dist/*.tar.gz
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists."
          else
            gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "TouchMusic $version" --notes-file release-notes.md
          fi
  publish-pypi:
    needs: build
    if: vars.PYPI_PUBLISH == 'true' || inputs.publish_pypi == true
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist/
      - name: Publish wheel and source distribution
        uses: pypa/gh-action-pypi-publish@release/v1
