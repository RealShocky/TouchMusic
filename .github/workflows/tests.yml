name: Python behavior checks
on: [push, pull_request, workflow_dispatch, workflow_call]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install app and test dependencies
        run: python -m pip install . pytest
      - name: Test standalone behavior
        run: python -m pytest tests -q
      - name: Check out the published comparison baseline
        uses: actions/checkout@v4
        with:
          ref: 99ede66b68aa2c30b3a94c9db24283a12669ae3e
          path: benchmark-baseline
          persist-credentials: false
      - name: Compare synthetic audio CPU and memory
        run: |
          python tools/benchmark_audio.py --source benchmark-baseline --label v0.4.0 --output benchmark-baseline.json
          python tools/benchmark_audio.py --label '${{ github.sha }}' --output benchmark-current.json
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-audio-benchmarks
          path: benchmark-*.json
