name: Native VST3 bridge checks
on:
  push:
    branches-ignore: [main]
    paths: ['native/**', 'tools/verify_native_bridge.py', '.github/workflows/native-bridge.yml']
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Configure VST3 SDK and plugin
        run: cmake -S native/control_bridge -B native-build -A x64 -DSMTG_RUN_VST_VALIDATOR=ON
      - name: Build and validate plugin
        run: cmake --build native-build --config Release --target TouchMusicControlBridge --parallel 4
      - name: Check host loading and native automation
        shell: pwsh
        run: |
          python -m pip install 'numpy<2' pedalboard
          $bundle = Get-ChildItem native-build -Recurse -Directory -Filter 'TouchMusic Control Bridge.vst3' | Select-Object -First 1
          if (-not $bundle) { throw 'VST3 bundle was not built' }
          python tools/verify_native_bridge.py $bundle.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Native automation check failed' }
      - name: Package native bridge
        shell: pwsh
        run: |
          $bundle = Get-ChildItem native-build -Recurse -Directory -Filter 'TouchMusic Control Bridge.vst3' | Select-Object -First 1
          if (-not $bundle) { throw 'VST3 bundle was not built' }
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          New-Item -ItemType Directory -Path native-package | Out-Null
          Copy-Item -LiteralPath $bundle.FullName -Destination native-package -Recurse
          Copy-Item native/control_bridge/STEINBERG-LICENSE.txt native-package/
          Copy-Item native/control_bridge/README.md native-package/
          Compress-Archive -Path native-package/* -DestinationPath "TouchMusic-$version-Control-Bridge-Windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: touchmusic-native-windows
          path: TouchMusic-*-Control-Bridge-Windows.zip
