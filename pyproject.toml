[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "touchmusic"
version = "0.4.0"
description = "Gesture-controlled live vocals, character voices, and beat-synced looping"
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [{name = "Mark Varkevisser"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "numpy>=1.26,<2",
    "scipy>=1.12,<1.16",
    "sounddevice>=0.5,<0.6",
    "soundfile>=0.12,<0.14",
    "PySide6>=6.8,<7",
    "pedalboard>=0.9.17,<1",
    "mediapipe==0.10.21",
    "opencv-contrib-python>=4.8,<4.12",
    "python-rtmidi>=1.5.8,<2",
]
dynamic = ["optional-dependencies"]

[project.scripts]
touchmusic = "touchmusic.__main__:main"

[project.urls]
Homepage = "https://github.com/RealShocky/TouchMusic"
Repository = "https://github.com/RealShocky/TouchMusic"
Issues = "https://github.com/RealShocky/TouchMusic/issues"

[tool.setuptools.packages.find]
include = ["touchmusic*"]
namespaces = false

[tool.setuptools.package-data]
touchmusic = ["ai-requirements.txt"]

[tool.setuptools.dynamic.optional-dependencies]
ai = {file = ["touchmusic/ai-requirements.txt"]}
